name: ci

on:
  push:
    branches:
      - "**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Go setup
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5

      - name: Lint with golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          args: -v --timeout=5m -E misspell

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Go setup
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5

      - name: Build
        run: make build

  test:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Go setup
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5

      - name: E2E Test
        env:
          PORTAL_VERSION: "v1.1.1" # version does not matter for outcome of test, just for building the image
        run: make test-e2e

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Go setup
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5

      - name: Build
        run: make build-wasm
