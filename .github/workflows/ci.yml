name: ci

on:
  push:
    branches:
      - "**"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Go setup
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5

      - name: Lint with golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          args: -v --timeout=5m -E misspell

      - name: Build
        run: make build

      - name: Test
        run: make test
